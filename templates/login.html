{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="auth-shell">
        <section class="auth-panel">
            <div class="auth-brand mb-4">
                <span class="auth-brand-icon"><i class="bi bi-wallet2"></i></span>
                <span>FinTrack</span>
            </div>

            <h1 class="h3 fw-bold mb-1">Log in</h1>
            <p class="text-muted mb-4">Access your personal finance dashboard.</p>

            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label fw-medium">Username</label>
                    <input type="text" class="form-control" id="username" autocomplete="username" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-medium">Password</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="loginButton">
                    <span id="loginButtonText">Log in</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                </button>
            </form>

            <p class="text-muted text-center mt-4 mb-0">
                New to FinTrack? <a href="/register/" class="fw-semibold">Create an account</a>
            </p>
        </section>
    </main>

    <script src="{% static 'js/auth.js' %}"></script>
    <script>
        if (Auth.isLoggedIn()) {
            window.location.href = '/dashboard/';
        }

        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');
        const button = document.getElementById('loginButton');
        const buttonText = document.getElementById('loginButtonText');
        const spinner = document.getElementById('loginSpinner');

        function setLoading(isLoading) {
            button.disabled = isLoading;
            buttonText.textContent = isLoading ? 'Logging in...' : 'Log in';
            spinner.classList.toggle('d-none', !isLoading);
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('d-none');
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            errorBox.classList.add('d-none');
            setLoading(true);

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.detail || 'Login failed. Check your username and password.');
                    return;
                }

                Auth.setTokens(data.access, data.refresh);
                Auth.setUserInfo(data.user);
                window.location.href = '/dashboard/';
            } catch (error) {
                showError('Could not reach the server. Try again.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
