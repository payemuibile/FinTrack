<!-- templates/accounts/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 2rem 0;
            background-color: #FBF8F2;
        }
        .auth-card {
            max-width: 460px;
            width: 100%;
            border-radius: 16px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="card auth-card shadow-lg p-4 mx-3">
        <div class="text-center mb-4">
<!--            <i class="bi bi-wallet2 text-primary" style="font-size: 2.5rem;">Fintrack</i>-->
            <h4 class="fw-bold mt-2 mb-0">Create your account</h4>
            <p class="text-muted small">Start tracking your finances today</p>
        </div>

        <div id="formError" class="alert alert-danger py-2 d-none"></div>
        <div id="formSuccess" class="alert alert-success py-2 d-none"></div>

        <form id="registerForm" novalidate>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-medium">First Name</label>
                    <input type="text" class="form-control" id="firstName">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-medium">Last Name</label>
                    <input type="text" class="form-control" id="lastName">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Username</label>
                <input type="text" class="form-control" id="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Password</label>
                <input type="password" class="form-control" id="password" required>
                <div class="form-text">At least 8 characters. Avoid common passwords.</div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Confirm Password</label>
                <input type="password" class="form-control" id="passwordConfirm" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="registerBtn">
                <span id="registerBtnText">Create Account</span>
                <span id="registerBtnSpinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
            </button>
        </form>

        <p class="text-center text-muted mt-4 mb-0 small">
            Already have an account? <a href="/login/" class="text-decoration-none fw-medium">Log in</a>
        </p>
    </div>

    <script src="{% static 'js/auth.js' %}"></script>
    <script>
        if (Auth.isLoggedIn()) {
            window.location.href = '/dashboard/';
        }

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const errorBox = document.getElementById('formError');
            const successBox = document.getElementById('formSuccess');
            const btn = document.getElementById('registerBtn');
            const btnText = document.getElementById('registerBtnText');
            const spinner = document.getElementById('registerBtnSpinner');

            errorBox.classList.add('d-none');
            successBox.classList.add('d-none');

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (password !== passwordConfirm) {
                errorBox.textContent = "Passwords don't match.";
                errorBox.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Creating account...';
            spinner.classList.remove('d-none');

            const payload = {
                first_name: document.getElementById('firstName').value.trim(),
                last_name: document.getElementById('lastName').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: password,
                password_confirm: passwordConfirm
            };

            try {
                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    // DRF validation errors come back as an object of field -> [messages]
                    // e.g. { "username": ["A user with that username already exists."] }
                    const firstKey = Object.keys(data)[0];
                    const message = Array.isArray(data[firstKey]) ? data[firstKey][0] : data[firstKey];
                    throw new Error(message || 'Registration failed. Please check your details.');
                }

                successBox.textContent = 'Account created! Redirecting to login...';
                successBox.classList.remove('d-none');
                document.getElementById('registerForm').reset();

                setTimeout(() => {
                    window.location.href = '/login/';
                }, 1500);

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('d-none');
                btn.disabled = false;
                btnText.textContent = 'Create Account';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
