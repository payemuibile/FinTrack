<!-- templates/accounts/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FBF8F2;
            font-family: 'Inter', sans-serif;
        }
        .auth-card {
            max-width: 420px;
            width: 100%;
            border-radius: 16px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="card auth-card shadow-lg p-4 mx-3">
        <div class="text-center mb-4">
<!--            <i class="bi bi-wallet2 text-primary" style="font-size: 2.5rem;"></i>-->
            <h4 class="fw-bold mt-2 mb-0">Welcome back</h4>
            <p class="text-muted small">Log in to your FinTrack account</p>
        </div>

        <div id="formError" class="alert alert-danger py-2 d-none"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label fw-medium">Username</label>
                <input type="text" class="form-control" id="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
                <span id="loginBtnText">Log In</span>
                <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
            </button>
        </form>

        <p class="text-center text-muted mt-4 mb-0 small">
            Don't have an account? <a href="/register/" class="text-decoration-none fw-medium">Sign up</a>
        </p>
    </div>

    <script src="{% static 'js/auth.js' %}"></script>
    <script>
        // If already logged in, skip the login page
        if (Auth.isLoggedIn()) {
            window.location.href = '/dashboard/';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const errorBox = document.getElementById('formError');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginBtnSpinner');

            errorBox.classList.add('d-none');
            btn.disabled = true;
            btnText.textContent = 'Logging in...';
            spinner.classList.remove('d-none');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    // DRF SimpleJWT returns { detail: "..." } on bad credentials
                    throw new Error(data.detail || 'Invalid username or password.');
                }

                // Store tokens and user info, then redirect
                Auth.setTokens(data.access, data.refresh);
                if (data.user) {
                    Auth.setUserInfo(data.user);
                }
                window.location.href = '/dashboard/';

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('d-none');
                btn.disabled = false;
                btnText.textContent = 'Log In';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
