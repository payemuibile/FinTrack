{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="auth-shell">
        <section class="auth-panel auth-panel-wide">
            <div class="auth-brand mb-4">
                <span class="auth-brand-icon"><i class="bi bi-wallet2"></i></span>
                <span>FinTrack</span>
            </div>

            <h1 class="h3 fw-bold mb-1">Create account</h1>
            <p class="text-muted mb-4">Start tracking income, expenses, and budgets.</p>

            <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
            <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>

            <form id="registerForm" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label fw-medium">First name</label>
                        <input type="text" class="form-control" id="firstName" autocomplete="given-name">
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label fw-medium">Last name</label>
                        <input type="text" class="form-control" id="lastName" autocomplete="family-name">
                    </div>
                    <div class="col-md-6">
                        <label for="username" class="form-label fw-medium">Username</label>
                        <input type="text" class="form-control" id="username" autocomplete="username" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-medium">Email</label>
                        <input type="email" class="form-control" id="email" autocomplete="email" required>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" class="form-control" id="password" autocomplete="new-password" required>
                    </div>
                    <div class="col-md-6">
                        <label for="passwordConfirm" class="form-label fw-medium">Confirm password</label>
                        <input type="password" class="form-control" id="passwordConfirm" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-4" id="registerButton">
                    <span id="registerButtonText">Create account</span>
                    <span id="registerSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                </button>
            </form>

            <p class="text-muted text-center mt-4 mb-0">
                Already have an account? <a href="/login/" class="fw-semibold">Log in</a>
            </p>
        </section>
    </main>

    <script src="{% static 'js/auth.js' %}"></script>
    <script>
        if (Auth.isLoggedIn()) {
            window.location.href = '/dashboard/';
        }

        const form = document.getElementById('registerForm');
        const errorBox = document.getElementById('registerError');
        const successBox = document.getElementById('registerSuccess');
        const button = document.getElementById('registerButton');
        const buttonText = document.getElementById('registerButtonText');
        const spinner = document.getElementById('registerSpinner');

        function setLoading(isLoading) {
            button.disabled = isLoading;
            buttonText.textContent = isLoading ? 'Creating account...' : 'Create account';
            spinner.classList.toggle('d-none', !isLoading);
        }

        function flattenErrors(errors) {
            if (typeof errors === 'string') return errors;
            if (Array.isArray(errors)) return errors.join(' ');
            if (!errors || typeof errors !== 'object') return 'Registration failed. Check the form and try again.';

            return Object.entries(errors)
                .map(([field, messages]) => `${field.replaceAll('_', ' ')}: ${flattenErrors(messages)}`)
                .join(' ');
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('d-none');
            successBox.classList.add('d-none');
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            errorBox.classList.add('d-none');
            successBox.classList.add('d-none');
            setLoading(true);

            try {
                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        first_name: document.getElementById('firstName').value.trim(),
                        last_name: document.getElementById('lastName').value.trim(),
                        username: document.getElementById('username').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value,
                        password_confirm: document.getElementById('passwordConfirm').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(flattenErrors(data));
                    return;
                }

                successBox.textContent = data.message || 'Account created successfully. Redirecting to login...';
                successBox.classList.remove('d-none');
                form.reset();
                setTimeout(() => {
                    window.location.href = '/login/';
                }, 900);
            } catch (error) {
                showError('Could not reach the server. Try again.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
